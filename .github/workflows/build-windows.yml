name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --paths src --name MSN_Appointment_Scheduler run_app.py
      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSN_Appointment_Scheduler_windows_unsigned
          path: dist/MSN_Appointment_Scheduler.exe
          if-no-files-found: error
